name: CairnCompanion
options:
  bundleIdPrefix: app.cairn
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  CairnCompanionKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: $(CAIRN_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
targets:
  CairnCompanion:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: CairnCompanionKit
        product: CairnRuntime
    entitlements:
      path: App/CairnCompanion.entitlements
      properties:
        # Lets the app use the dashboard's passkeys (the same ones Safari uses). The domain is yours:
        # set CAIRN_PASSKEY_DOMAIN in Config/Local.xcconfig; it is never committed.
        com.apple.developer.associated-domains:
          - webcredentials:$(CAIRN_PASSKEY_DOMAIN)
        # Needs "CarPlay Driving Task App" enabled on the App ID and a provisioning profile that
        # carries it, or signing fails. See docs/carplay.md.
        com.apple.developer.carplay-driving-task: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAIRN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        # The CarPlay scene is declared by hand below; Xcode's generated manifest would replace it.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cairn
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Cairn Companion connects to your Cairn device over Bluetooth to send it phone GPS fixes.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Cairn Companion streams your phone's location to your Cairn device during a driving session.
        INFOPLIST_KEY_NSMotionUsageDescription: Cairn Companion reads the barometer to send relative altitude to your Cairn device.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Cairn Companion starts sending your phone's location to your Cairn device when it connects, even if the app is in the background.
    info:
      path: App/Info.plist
      properties:
        UIBackgroundModes: [location, bluetooth-central]
        # Only the CarPlay role is declared. The phone's window scene is left to SwiftUI's
        # WindowGroup, which supplies the default configuration itself.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: Cairn CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: app.cairn.companion.configure
            CFBundleURLSchemes: [cairn]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
